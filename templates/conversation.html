<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation - AI News Podcast</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="conversation-layout">
  <header class="topbar">
    <a class="back-link" href="{{ url_for('index') }}">&larr; AI NEWSCAST</a>
    <a id="back-to-news" class="text-link" href="{{ url_for('news.news_page') }}" hidden>Back to news</a>
  </header>

  <main class="container conversation">
    <h1 id="episode-title" class="episode-heading">Loading episode&hellip;</h1>
    <p id="episode-meta" class="episode-meta"></p>
    <div id="status" class="status" role="status"></div>

    <section id="voice-settings" class="voice-settings" aria-label="Voice settings" hidden>
      <div class="voice-row">
        <label class="voice-label" for="host-a-voice">Host A voice</label>
        <select id="host-a-voice" class="voice-select"></select>
        <button id="host-a-sample" type="button" class="secondary-btn">Preview</button>
      </div>
      <div class="voice-row">
        <label class="voice-label" for="host-b-voice">Host B voice</label>
        <select id="host-b-voice" class="voice-select"></select>
        <button id="host-b-sample" type="button" class="secondary-btn">Preview</button>
      </div>
      <div class="voice-actions">
        <button id="apply-voices-btn" type="button" class="primary-btn" disabled>Apply to episode</button>
        <span id="voice-status" class="voice-status" role="status"></span>
      </div>
    </section>

    <div id="transcript" class="transcript" aria-live="off"></div>
  </main>

  <section id="player" class="player" aria-label="Podcast player" hidden>
    <div id="waveform" class="waveform" aria-hidden="true"></div>
    <div class="player-row">
      <span id="time-display" class="time-display">00:00 / 00:00</span>
      <input id="progress" class="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Progress">
    </div>
    <div class="player-row controls">
      <div class="controls-main">
        <button id="prev-btn" type="button" class="ctrl-btn" aria-label="Previous">&#9198;</button>
        <button id="play-btn" type="button" class="ctrl-btn play" aria-label="Play">&#9654;</button>
        <button id="next-btn" type="button" class="ctrl-btn" aria-label="Next">&#9197;</button>
      </div>
      <label class="volume-wrap">
        <span aria-hidden="true">&#128266;</span>
        <input id="volume" class="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
      </label>
    </div>
  </section>

  <script id="languages-data" type="application/json">{{ languages|tojson }}</script>
  <script id="voice-options-data" type="application/json">{{ voice_options|tojson }}</script>
  <script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>
</html>
