<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Results - AI News Podcast</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/language-additions.css') }}">
</head>
<body class="news-layout">
  <header class="topbar">
    <a class="back-link" href="{{ url_for('index') }}">&larr; AI NEWSCAST</a>
    <form class="search-form compact" action="{{ url_for('news.news_page') }}" method="get" autocomplete="off">
      <input id="topic-input" name="q" type="text" placeholder="Search another topic" maxlength="200" required>
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="container wide newspaper-main">
    <h2 id="results-title" class="visually-hidden">News</h2>
    <div id="status" class="status newspaper-status" role="status" aria-live="polite"></div>
    <div id="results" class="newspaper-results" aria-live="polite"></div>

  </main>

  <div class="action-bar">
    <div class="selection-info">
      <span id="selected-count" class="selected-count">0 selected</span>
      <button id="clear-btn" type="button" class="link-btn" hidden>Clear</button>
      <span id="selection-note" class="selection-note" role="status"></span>
    </div>
    <div class="action-right">
      <label class="language-picker" for="language-select">
        <span class="language-label">Language</span>
        <select id="language-select" class="language-select" data-default="{{ default_language }}">
          {% for lang in languages %}
          <option value="{{ lang.code }}"{% if lang.code == default_language %} selected{% endif %}{% if not lang.available %} disabled{% endif %}>{{ lang.name }}{% if not lang.available %} (coming soon){% endif %}</option>
          {% endfor %}
        </select>
      </label>
      <button id="create-btn" type="button" class="primary-btn" disabled>CREATE AI PODCAST</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/news.js') }}"></script>
</body>
</html>
